name: release-nuget

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: NuGet version, for example 0.4.0-preview.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Validate release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: python eng/release-version.py
      - run: dotnet restore SafeSharp.sln
      - run: dotnet build SafeSharp.sln -c Release --no-restore -p:Version="$RELEASE_VERSION"
      - run: dotnet test tests/SafeSharp.Tests/SafeSharp.Tests.csproj -c Release --no-build
      - run: python tests/cli/verify.py --tool src/SafeSharp.Tool/bin/Release/net10.0/SafeSharp.Tool.dll
      - run: dotnet pack SafeSharp.sln -c Release --no-build -o artifacts/packages -p:Version="$RELEASE_VERSION"
      - run: python eng/verify-packages.py artifacts/packages
      - run: python eng/smoke-consumer.py artifacts/packages --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-${{ env.RELEASE_VERSION }}
          path: artifacts/packages/
      - name: Obtain short-lived NuGet credential
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'artifacts/packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
