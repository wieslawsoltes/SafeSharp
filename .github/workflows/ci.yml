name: build-test-package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SafeSharp.sln
      - run: dotnet build SafeSharp.sln -c Release --no-restore
      - run: dotnet test tests/SafeSharp.Tests/SafeSharp.Tests.csproj -c Release --no-build --logger trx --results-directory artifacts/tests
      - run: python tests/cli/verify.py --tool src/SafeSharp.Tool/bin/Release/net10.0/SafeSharp.Tool.dll
      # Build the independent benchmark oracle and verify every scenario's semantics;
      # single-sample timings are informational, never a performance gate.
      - run: dotnet run --project benchmarks/SafeSharp.Benchmarks -c Release -- all --iterations 1 --warmup 0 --json artifacts/benchmarks/smoke.json
      - run: dotnet pack SafeSharp.sln -c Release --no-build -o artifacts/packages
      - run: python eng/verify-packages.py artifacts/packages
      - run: python eng/smoke-consumer.py artifacts/packages --version 0.4.0-preview.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn

