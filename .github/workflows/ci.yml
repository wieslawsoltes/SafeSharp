name: build-test-package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SafeSharp.sln
      - run: dotnet build SafeSharp.sln -c Release --no-restore
      - run: dotnet test tests/SafeSharp.Tests/SafeSharp.Tests.csproj -c Release --no-build --logger trx --results-directory artifacts/tests --collect:"XPlat Code Coverage"
      - name: Verify coverage collection
        shell: python
        run: |
          import pathlib
          import xml.etree.ElementTree as ET

          reports = list(pathlib.Path("artifacts/tests").rglob("coverage.cobertura.xml"))
          if not reports:
              raise SystemExit("Coverlet did not produce a Cobertura report.")
          for report in reports:
              coverage = ET.parse(report).getroot()
              if coverage.tag != "coverage" or int(coverage.get("lines-covered", "0")) <= 0:
                  raise SystemExit(f"{report}: expected coverage with executed source lines.")
              print(f"{report}: {coverage.get('lines-covered')} source lines covered")
      - run: python tests/cli/verify.py --tool src/SafeSharp.Tool/bin/Release/net10.0/SafeSharp.Tool.dll
      # Build the independent benchmark oracle and verify every scenario's semantics;
      # single-sample timings are informational, never a performance gate.
      - run: dotnet run --project benchmarks/SafeSharp.Benchmarks -c Release -- all --iterations 1 --warmup 0 --json artifacts/benchmarks/smoke.json
      - run: dotnet pack SafeSharp.sln -c Release --no-build -o artifacts/packages
      - run: python eng/verify-packages.py artifacts/packages
      - run: python eng/smoke-consumer.py artifacts/packages --version 0.4.0-preview.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn

