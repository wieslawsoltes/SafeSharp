version: 2
updates:
  # NuGet discovery follows ProjectReference edges into other directories.
  # Apply the same servicing policy to the whole graph, including shipping
  # components reached through modern hosts. Package checks remain authoritative.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: Microsoft.CodeAnalysis*
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: System.Composition*
        # MEF 9 servicing also changes AssemblyVersion; review all MEF version
        # updates manually, including modern hosts. Security updates stay eligible.
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: System.Collections.Immutable
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      roslyn:
        # Roslyn servicing remains eligible. Review related MEF requirements with
        # each update; the MEF version-update policy above takes precedence.
        patterns: ['Microsoft.CodeAnalysis*', 'System.Composition*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

