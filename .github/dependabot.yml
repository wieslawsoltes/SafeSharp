version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      roslyn:
        # Workspaces and MEF must move together to avoid package downgrades.
        # The package-host gate preserves the shipping analyzer's older API
        # floor while the tests and standalone tool can use a newer host.
        patterns: ['Microsoft.CodeAnalysis*', 'System.Composition*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
